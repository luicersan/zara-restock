name = "zara-restock"
main = "src/index.js"
compatibility_date = "2026-07-22"

# Sin [triggers]/cron: Zara bloquea cualquier peticion sin navegador real
# (ZARA-API.md), asi que el Worker no puede consultarla. La comprobacion
# periodica cada 2 minutos la hace check-local.js desde un ordenador
# (SPEC.md SS7.3), no un cron de Cloudflare.

# El database_id lo devuelve "npx wrangler d1 create zara-restock".
# Pegalo aqui antes del primer despliegue.
[[d1_databases]]
binding = "DB"
database_name = "zara-restock"
database_id = "b6841186-9931-4b11-a565-771c5546e8b0"

# RESEND_API_KEY NO va aqui. Es un secret:
#   npx wrangler secret put RESEND_API_KEY
